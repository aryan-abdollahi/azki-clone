<!DOCTYPE html>
<html>
  <head>
    <title>azki.com</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body dir="rtl">
    <header>
      <div class="header-section">
        <div class="header-section-rightside">
          <div class="header-section-logo">
            <img
              class="img-section-logo"
              src="Assets/Images/azki-side-logo.webp"
              alt="azki-logo"
            />
            <img
              class="img-section-logo-left"
              src="Assets/Images/azki-logo-simple.svg"
              alt="azki-logo"
            />
          </div>
          <nav class="item-section">
            <ul class="header-section-items">
              <li>بیمه ها</li>
              <li>خسارت</li>
              <li>اقساط و اعتبار</li>
              <li>شرکت های بیمه</li>
              <li>فروشنده شوید!</li>
            </ul>
          </nav>
        </div>
        <div class="header-section-leftside">
          <button class="button-support">
            <img class="Icon-section" src="Assets/Icons/headsphone.png" alt="Icon">
            <p>پشتیبانی</p>
          </button>
          <button>
            <p>ورود / ثبت نام</p>
          </button>
        </div>
      </div>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
